# Cloudflare Worker — MusicStream Cache
# Deploy: npx wrangler deploy  (from this folder)
name = "music-stream-cache"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Serve on the default *.workers.dev subdomain
workers_dev = true

# ---- Tier-2 cache: permanent full audio files ----
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "music-audio-cache"

# ---- Short-lived stream URL cache (signed NCT tokens expire after a few hours) ----
# Create first with: npx wrangler kv namespace create STREAM_URL_KV
# Then paste the generated "id" below.
[[kv_namespaces]]
binding = "STREAM_URL_KV"
id = "32507b30619d40f7be17434056667486"

[vars]
# NCT music API (same base used by app/api/nhaccuatui/stream)
NCT_API_BASE_URL = "https://music-api.vanhuy2004h.io.vn"

# Optional fallback backend that resolves an NCT song id to a playable stream URL.
# Contract: GET <MATCHING_SERVICE_URL>?id=<nctSongId>
#   -> 200 JSON { "url": "https://<app>/api/youtube/stream?id=<videoId>" }
#
# The app-side endpoint (/api/nhaccuatui/match-stream) resolves NCT metadata
# (title/artist/duration), finds the best matching YouTube video, and returns a
# URL pointing at the YouTube PROXY endpoint (/api/youtube/stream) — never a raw
# googlevideo URL. googlevideo URLs are IP-bound to the Vercel instance that
# extracted them; fetching one directly from this Worker returns 403, while the
# proxy re-serves the bytes from the resolving server, so it works from anywhere.
MATCHING_SERVICE_URL = "https://phongtctmusic.vercel.app/api/nhaccuatui/match-stream"
