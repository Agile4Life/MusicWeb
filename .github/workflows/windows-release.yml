name: Windows Release (BlueSymphony-rs)

on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release label (e.g. windows-v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows/BlueSymphony-rs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'windows/BlueSymphony-rs -> target'

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Unit Tests
        run: cargo test --workspace --locked

      - name: Build Release Binary
        run: cargo build --release --locked -p bs-app

      - name: Package Versioned Portable ZIP & Checksums
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } elseif ($env:INPUT_TAG) {
            $env:INPUT_TAG
          } else {
            "manual-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          $zipName = "BlueSymphony-$version-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path dist\BlueSymphony\config | Out-Null
          Copy-Item target\release\bs-app.exe dist\BlueSymphony\BlueSymphony.exe -Force
          Copy-Item README.md dist\BlueSymphony\README.md -Force
          Copy-Item config\secrets.example.toml dist\BlueSymphony\config\secrets.example.toml -Force
          Compress-Archive -Path dist\BlueSymphony\* -DestinationPath "dist\$zipName" -Force
          $zipHash = (Get-FileHash "dist\$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash dist\BlueSymphony\BlueSymphony.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$zipHash  $zipName"
            "$exeHash  BlueSymphony.exe"
          ) | Set-Content -Path dist\SHA256SUMS.txt -Encoding UTF8

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueSymphony-release-windows-x64
          path: |
            windows/BlueSymphony-rs/dist/BlueSymphony-*.zip
            windows/BlueSymphony-rs/dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          name: BlueSymphony Windows ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            windows/BlueSymphony-rs/dist/BlueSymphony-*.zip
            windows/BlueSymphony-rs/dist/SHA256SUMS.txt

