# Cloudflare Worker — Google Drive Audio R2 Streaming Cache
name = "music-drive-stream-cache"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "music-audio-cache-drive"

[vars]
APP_RESOLVE_ORIGIN_URL = "https://phongtctmusic.vercel.app/api/drive-resolve-origin"
# Set INTERNAL_RESOLVE_SECRET via Cloudflare secret (never commit plaintext):
# npx wrangler secret put INTERNAL_RESOLVE_SECRET
